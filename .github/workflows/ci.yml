name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l . | grep -v '^$')" || (gofmt -l . && exit 1)
      - name: Source budget
        run: test "$(find . -name '*.go' ! -name '*_test.go' -exec cat {} + | wc -l)" -lt 10000
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o /dev/null .
